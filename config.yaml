# Central Himalaya ConvLSTM forecasting: configuration
# All values below are INITIAL experimental choices, not validated settings.

study:
  min_lat: 26.5
  max_lat: 31.5
  min_lon: 78.0
  max_lon: 88.0
  start_date: "1980-01-01"
  end_date: "2025-12-31"

catalogue:
  source: "USGS ComCat (FDSN event web service)"
  base_url: "https://earthquake.usgs.gov/fdsnws/event/1"
  # Initial candidate threshold only. Completeness must be assessed from data.
  # The download uses a LOWER floor so completeness can be studied.
  download_min_magnitude: 2.5
  candidate_min_magnitude: 4.0
  event_type: "earthquake"
  # Window length in years. The service returns at most 20000 events per query,
  # so the downloader also splits a window further if the count is too high.
  window_years: 5
  max_events_per_request: 20000
  request_timeout_s: 60
  max_retries: 4
  retry_backoff_s: 5
  pause_between_requests_s: 1.0
  # If the live service is unreachable, put a USGS-format CSV here.
  local_csv_fallback: "data/raw/usgs_manual_download.csv"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  figures_dir: "outputs/figures"
  metrics_dir: "outputs/metrics"
  forecasts_dir: "outputs/forecasts"
  models_dir: "models"

grid:
  resolution_deg: 0.25

sequence:
  input_months: 12
  horizon_months: 1

# Used from stage 3 onward
split:
  train: 0.70
  val: 0.15
  test: 0.15

seed: 42
